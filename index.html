<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Pro Simulator</title>
    <style>
        :root { --hijau: #26a69a; --merah: #ef5350; --gelap: #131722; }
        body { font-family: 'Trebuchet MS', sans-serif; background: var(--gelap); color: white; margin: 0; padding: 10px; }
        .header { text-align: center; padding: 10px; border-bottom: 1px solid #2a2e39; }
        
        /* Widget Grafik */
        .chart-container { height: 400px; margin: 15px 0; border: 1px solid #2a2e39; border-radius: 8px; overflow: hidden; }
        
        /* Panel Simulasi */
        .simulasi-panel { background: #1e222d; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #363a45; }
        .saldo-box { font-size: 20px; color: var(--hijau); font-weight: bold; margin-bottom: 10px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #434651; background: #2a2e39; color: white; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .buy { background: var(--hijau); }
        .sell { background: var(--merah); }
    </style>
</head>
<body>

<div class="header">
    <h2>📈 Live Trading Pro</h2>
    <p>Harga Real-Time dari Pasar Dunia</p>
</div>

<div class="chart-container">
    <div id="tradingview_chart"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "1",
      "timezone": "Asia/Jakarta",
      "theme": "dark",
      "style": "1",
      "locale": "id",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "save_image": false,
      "container_id": "tradingview_chart"
    });
    </script>
</div>

<div class="simulasi-panel">
    <div class="saldo-box">Saldo Demo: $<span id="saldo">1000</span></div>
    <input type="number" id="amount" placeholder="Jumlah Investasi ($)">
    <div class="btn-group">
        <button class="btn buy" onclick="trade('BUY')">NAIK (Buy)</button>
        <button class="btn sell" onclick="trade('SELL')">TURUN (Sell)</button>
    </div>
    <p id="notif" style="text-align: center; font-size: 14px; margin-top: 10px;"></p>
</div>

<script>
    let saldo = 1000;
    function trade(tipe) {
        let amount = document.getElementById('amount').value;
        if(amount == "" || amount <= 0) {
            alert("Isi jumlah dolar dulu bos!");
            return;
        }
        
        document.getElementById('notif').innerHTML = "⏳ Menganalisa pasar...";
        
        // Simulasi hasil (acak)
        setTimeout(() => {
            let win = Math.random() > 0.5;
            if(win) {
                let untung = amount * 0.8;
                saldo += untung;
                document.getElementById('notif').innerHTML = "✅ PROFIT! Kamu untung $" + untung.toFixed(2);
                document.getElementById('notif').style.color = "#26a69a";
            } else {
                saldo -= amount;
                document.getElementById('notif').innerHTML = "❌ LOSS! Saldo berkurang $" + amount;
                document.getElementById('notif').style.color = "#ef5350";
            }
            document.getElementById('saldo').innerHTML = saldo.toFixed(2);
        }, 2000);
    }
</script>

</body>
</html>
